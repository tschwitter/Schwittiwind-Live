name: Wetterdaten berechnen und veröffentlichen

on:
  schedule:
    # Läuft alle 3 Stunden ca. 2h15 nach Modellstart (02:15, 05:15, 08:15, 11:15, 14:15, 17:15, 20:15, 23:15 UTC)
    - cron: '15 2,5,8,11,14,17,20,23 * * *'
  workflow_dispatch: # Ermöglicht manuelles Starten mit einem Klick!

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Werkzeuge installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Wetter-Pipeline ausführen
        run: |
          python run_pipeline.py

      - name: GitHub Pages einrichten
        uses: actions/configure-pages@v5

      - name: Artefakt hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

      - name: Auf GitHub Pages bereitstellen
        id: deployment
        uses: actions/deploy-pages@v4
