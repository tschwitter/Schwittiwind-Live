name: Wetterdaten berechnen und veröffentlichen

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Berechnung erzwingen (auch wenn kein neuer Lauf da ist)'
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"

jobs:
  # STUFE 1: Vorbereitung für beide Modelle
  check-and-prepare:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.prep.outputs.should_run }}
      matrix_config: ${{ steps.prep.outputs.matrix_config }}
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Werkzeuge installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Schnellprüfung & Vorbereitung (CH1 & CH2)
        id: prep
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            python -u run_pipeline.py --prepare --force
          else
            python -u run_pipeline.py --prepare
          fi

      - name: Basis-Website zwischenspeichern
        if: steps.prep.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: site-base
          path: dist/

  # STUFE 2: DYNAMISCHE MATRIX (Berechnet Chunks für CH1 und CH2)
  compute-matrix:
    needs: check-and-prepare
    if: needs.check-and-prepare.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.check-and-prepare.outputs.matrix_config) }}
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Werkzeuge installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Berechne ${{ matrix.model }} Chunk ${{ matrix.chunk }} (${{ matrix.start }} bis ${{ matrix.end }})
        run: |
          python -u run_pipeline.py --model ${{ matrix.model }} --start-step ${{ matrix.start }} --end-step ${{ matrix.end }} --ref-time "${{ matrix.ref_time }}"

      - name: Chunk-Daten speichern
        uses: actions/upload-artifact@v4
        with:
          name: chunk-${{ matrix.model }}-${{ matrix.chunk }}
          path: dist/data/
          if-no-files-found: ignore

  # STUFE 3: Alle aktiven Chunks zusammenführen und live schalten
  deploy:
    needs: [check-and-prepare, compute-matrix]
    if: needs.check-and-prepare.outputs.should_run == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Basis-Website abrufen
        uses: actions/download-artifact@v4
        with:
          name: site-base
          path: dist/

      - name: Alle Chunks zusammenführen
        uses: actions/download-artifact@v4
        with:
          pattern: chunk-*
          path: dist/data/
          merge-multiple: true

      - name: GitHub Pages konfigurieren
        uses: actions/configure-pages@v5

      - name: Gesamtes Paket bereitstellen
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

      - name: Live schalten auf GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
