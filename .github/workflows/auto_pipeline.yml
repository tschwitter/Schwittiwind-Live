name: Wetterdaten berechnen und veröffentlichen

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Berechnung erzwingen (auch wenn kein neuer Lauf da ist)'
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"

jobs:
  # STUFE 1: Vorbereitung (Schlank & blitzschnell)
  check-and-prepare:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.prep.outputs.should_run }}
      matrix_config: ${{ steps.prep.outputs.matrix_config }}
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Werkzeuge installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Schnellprüfung & Vorbereitung (CH1 & CH2)
        id: prep
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            python -u run_pipeline.py --prepare --force
          else
            python -u run_pipeline.py --prepare
          fi

      - name: Basis-Dateien zwischenspeichern (nur Metadaten < 50 KB!)
        if: steps.prep.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: site-base
          path: dist/

  # STUFE 2: DYNAMISCHE MATRIX
  compute-matrix:
    needs: check-and-prepare
    if: needs.check-and-prepare.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.check-and-prepare.outputs.matrix_config) }}
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Werkzeuge installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Berechne ${{ matrix.model }} Lauf ${{ matrix.run_id }} Chunk ${{ matrix.chunk }}
        run: |
          python -u run_pipeline.py --model ${{ matrix.model }} --run-id ${{ matrix.run_id }} --start-step ${{ matrix.start }} --end-step ${{ matrix.end }} --ref-time "${{ matrix.ref_time }}"

      # Speichert den Zielordner dist/data/ inklusive der Unterordnerstruktur model/run_id/
      - name: Chunk-Daten speichern
        uses: actions/upload-artifact@v4
        with:
          name: chunk-${{ matrix.model }}-${{ matrix.chunk }}
          path: dist/data/
          if-no-files-found: ignore

  # STUFE 3: Deploy mit frischem Cache und schlanken Paketen
  deploy:
    needs: [check-and-prepare, compute-matrix]
    if: needs.check-and-prepare.outputs.should_run == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken (für Pruning-Skript)
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 1. Frischer Cache-Schlüssel (verwirft die alten 5.7 GB Altlasten dauerhaft!)
      - name: Historischen Datenbestand wiederherstellen
        uses: actions/cache/restore@v4
        with:
          path: dist/data
          key: hist-runs-v4-${{ github.run_id }}
          restore-keys: |
            hist-runs-v4-

      # 2. Basis-Website abrufen
      - name: Basis-Website abrufen
        uses: actions/download-artifact@v4
        with:
          name: site-base
          path: dist/

      # 3. Neue Chunks sauber einsortieren
      - name: Neue Chunks zusammenführen
        uses: actions/download-artifact@v4
        with:
          pattern: chunk-*
          path: dist/data/
          merge-multiple: true

      # 4. Alte Läufe und verirrte Dateien bereinigen
      - name: Veraltete Läufe bereinigen & Verzeichnis aufräumen
        run: |
          # Lösche versehentlich lose abgelegte Dateien im data-Wurzelverzeichnis
          find dist/data -maxdepth 1 -type f ! -name "runs.json" -delete 2>/dev/null || true
          PYTHONPATH=. python -u run_pipeline.py --prune
          # Protokolliere tatsächliche Ordnergröße
          du -sh dist/ dist/data/* || true

      # 5. Sauberen Datenbestand für nächste Durchläufe sichern
      - name: Aktualisierten Datenbestand cachen
        uses: actions/cache/save@v4
        if: always()
        with:
          path: dist/data
          key: hist-runs-v4-${{ github.run_id }}

      - name: GitHub Pages konfigurieren
        uses: actions/configure-pages@v5

      - name: Gesamtes Paket bereitstellen
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

      - name: Live schalten auf GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
