name: Wetterdaten berechnen und veröffentlichen

on:
  schedule:
    # Fragt alle 5 Minuten nach neuen Daten (auf dem Default Branch)
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Berechnung erzwingen (auch wenn kein neuer Lauf da ist)'
        type: boolean
        default: false
  push:
    branches:
      - performance    # <--- NUR performance! 'main' wird bei Push komplett ignoriert.

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Werkzeuge installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Wetter-Pipeline ausführen
        id: run_step
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            python run_pipeline.py --force
          else
            python run_pipeline.py
          fi

      - name: GitHub Pages einrichten
        if: steps.run_step.outputs.updated == 'true'
        uses: actions/configure-pages@v5

      - name: Artefakt hochladen
        if: steps.run_step.outputs.updated == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

      - name: Auf GitHub Pages bereitstellen
        if: steps.run_step.outputs.updated == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
