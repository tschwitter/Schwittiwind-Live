<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ICON Wetter & Ensembles (CH1 & CH2)</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css?v=3" />
</head>
<body>

    <!-- Die Karte -->
    <div id="map"></div>

    <!-- OBERES KONTROLL-PANEL -->
    <div class="top-control-panel">
        <!-- ZEILE 1: HAUPTPARAMETER -->
        <div class="top-row">
            <button class="nav-toggle-btn" id="btnToggleWetter" onclick="toggleWetterMenu()">Wetter ▾</button>
            <button class="var-btn" id="varBtn-wind" onclick="switchLayer1('wind')">10m Wind</button>
            <button class="var-btn" id="varBtn-gust" onclick="switchLayer1('gust')">Böen</button>
            <button class="nav-toggle-btn" id="btnToggleHoehen" onclick="toggleHoehenMenu()">Höhenwind ▾</button>
        </div>

        <!-- ZEILE 2: WETTER-SUBLEISTE -->
        <div class="top-row sub-nav-row" id="wetterSubRow" style="display: none;"></div>

        <!-- ZEILE 3: HÖHENWIND-SUBLEISTE -->
        <div class="top-row sub-nav-row" id="hoehenSubRow" style="display: none;"></div>

        <!-- ZEILE 4: MODELLE (CH1/CH2) + 2. EBENE + EINSTELLUNGEN -->
        <div class="top-row bottom-nav-row">
            <div class="model-toggle-group">
                <button class="model-btn active" id="btnModel-icon-ch1" onclick="handleModelButtonClick('icon-ch1')">CH1 ▾</button>
                <button class="model-btn" id="btnModel-icon-ch2" onclick="handleModelButtonClick('icon-ch2')">CH2 ▾</button>
            </div>

            <button class="layer2-btn" id="layer2Btn" onclick="toggleLayer2Dropdown()">+ 2. Ebene</button>
            <button class="settings-btn" id="settingsBtn" onclick="toggleSettings()" title="Ebenen-Einstellungen">⚙</button>
        </div>
    </div>

    <!-- SCHWEBENDE MENÜS -->
    <div class="floating-popup runs-dropdown-popup" id="runDropdown-icon-ch1"></div>
    <div class="floating-popup runs-dropdown-popup" id="runDropdown-icon-ch2"></div>
    <div class="floating-popup layer2-dropdown-popup" id="layer2Dropdown"></div>

    <!-- EINSTELLUNGEN-POPUP -->
    <div class="floating-popup settings-popup" id="settingsPopup">
        <div class="settings-title">⚙ Ebenen-Optionen</div>
        
        <div class="settings-section">
            <div class="settings-section-title" id="cfgTitleL1">1. Ebene: Basis</div>
            <div class="settings-row">
                <span>Darstellung:</span>
                <div class="mode-toggle-group">
                    <button class="mode-btn active" id="btnModeFillL1" onclick="setLayerMode(1, 'fill')">Farbe</button>
                    <button class="mode-btn" id="btnModeLineL1" onclick="setLayerMode(1, 'line')">Linien</button>
                </div>
            </div>
            <div class="settings-row">
                <span>Transparenz:</span>
                <input type="range" class="opacity-slider" id="opacitySliderL1" min="10" max="100" value="55" oninput="setLayerOpacity(1, this.value)">
                <span id="opacityLabelL1" style="width: 25px; text-align: right;">55%</span>
            </div>
        </div>

        <div class="settings-section" id="cfgSectionL2" style="opacity: 0.5;">
            <div class="settings-section-title" id="cfgTitleL2" style="color: #64b5f6;">2. Ebene: Keine</div>
            <div class="settings-row">
                <span>Darstellung:</span>
                <div class="mode-toggle-group">
                    <button class="mode-btn active" id="btnModeFillL2" onclick="setLayerMode(2, 'fill')">Farbe</button>
                    <button class="mode-btn" id="btnModeLineL2" onclick="setLayerMode(2, 'line')">Linien</button>
                </div>
            </div>
            <div class="settings-row">
                <span>Transparenz:</span>
                <input type="range" class="opacity-slider" id="opacitySliderL2" min="10" max="100" value="65" oninput="setLayerOpacity(2, this.value)">
                <span id="opacityLabelL2" style="width: 25px; text-align: right;">65%</span>
            </div>
        </div>
    </div>

    <div id="loadingIndicator">Lade Wetterdaten...</div>

    <!-- RECHTES PANEL (LÄUFE) -->
    <div class="member-panel">
        <div class="member-panel-title">Läufe</div>
        <div class="member-section-title">Hauptlauf</div>
        <div id="hauptlaufContainer"></div>
        <div id="ensembleGroup">
            <div class="member-section-title">Ensemble</div>
            <div id="ensembleContainer"></div>
            <div class="member-section-title">Statistiken</div>
            <div id="statistikenContainer"></div>
        </div>
        <div id="onlyHlNotice" class="only-hl-info">Nur Hauptlauf</div>
    </div>

    <!-- UNTERES KONTROLLZENTRUM -->
    <div class="control-panel">
        <div class="day-buttons-row" id="dayButtonsContainer"></div>
        <div class="main-controls-row">
            <button class="nav-btn" onclick="navLeft()">◀</button>
            <input type="range" id="timeSlider" min="0" max="23" value="0">
            <button class="nav-btn" onclick="navRight()">▶</button>
            <div class="member-nav-stack">
                <button class="member-stack-btn" onclick="navUp()">▲</button>
                <button class="member-stack-btn" onclick="navDown()">▼</button>
            </div>
            <button class="nav-mode-btn" id="navModeBtn" onclick="toggleNavMode()" title="Modus für ▲/▼: Member oder Modelläufe">Mbr</button>
        </div>
        <div class="bottom-labels-row">
            <span id="currentStepLabel">Wird geladen...</span>
            <span id="modelRunLabel">🕒 Wird geladen...</span>
        </div>
    </div>

    <!-- DYNAMISCHE LEGENDE -->
    <div class="legend-box" id="legendBox"></div>

    <!-- Bibliotheken & JavaScript-Anwendungslogik -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/d3-contour@4"></script>
    <script src="app.js?v=3"></script>
</body>
</html>
