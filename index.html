<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ICON Wetter & Ensembles (CH1 & CH2)</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css?v=22" />
</head>
<body>

    <!-- Die Karte -->
    <div id="map"></div>

    <!-- EINSTELLUNGS-BUTTON OBEN LINKS (UNTER LEAFLET ZOOM + / -) -->
    <div class="custom-settings-control">
        <a href="#" class="settings-control-btn" id="settingsBtn" onclick="toggleSettings(event)" title="Karten- & Ebenen-Optionen">⚙</a>
    </div>

    <!-- OBERES KONTROLL-PANEL (MITTE) -->
    <div class="top-control-panel">
        <!-- ZEILE 1: HAUPTPARAMETER -->
        <div class="top-row">
            <button class="nav-toggle-btn" id="btnToggleWetter" onclick="toggleWetterMenu()">Wetter ▾</button>
            <button class="var-btn" id="varBtn-wind" onclick="switchLayer1('wind')">10m Wind</button>
            <button class="var-btn" id="varBtn-gust" onclick="switchLayer1('gust')">Böen</button>
            <button class="nav-toggle-btn" id="btnToggleHoehen" onclick="toggleHoehenMenu()">Höhenwind ▾</button>
        </div>

        <!-- ZEILE 2: WETTER-SUBLEISTE (FLEX-WRAP MEHRZEILIG) -->
        <div class="top-row sub-nav-row" id="wetterSubRow" style="display: none;"></div>

        <!-- ZEILE 3: HÖHENWIND-SUBLEISTE (FLEX-WRAP MEHRZEILIG) -->
        <div class="top-row sub-nav-row" id="hoehenSubRow" style="display: none;"></div>

        <!-- 2. EBENE: SCHLANKE DROP NOTCH -->
        <div class="layer2-anchor-wrap">
            <button class="layer2-btn" id="layer2Btn" onclick="toggleLayer2Dropdown()">
                <svg class="notch-bg-svg" viewBox="0 0 120 22" preserveAspectRatio="none" aria-hidden="true">
                    <path class="notch-path" d="M 0,0 C 12,0 18,7 24,15 C 28,21 34,22 42,22 L 78,22 C 86,22 92,21 96,15 C 102,7 108,0 120,0 Z" />
                </svg>
                <span class="notch-label">+ 2. Ebene</span>
            </button>
        </div>
    </div>

    <!-- MODELL-AUSWAHL RECHTS ÜBER DEM LÄUFE-PANEL -->
    <div class="model-select-header">
        <div class="model-toggle-group">
            <button class="model-btn active" id="btnModel-icon-ch1" onclick="handleModelButtonClick('icon-ch1')">
                <span class="model-title">CH1 ▾</span>
                <span class="model-time">--</span>
            </button>
            <button class="model-btn" id="btnModel-icon-ch2" onclick="handleModelButtonClick('icon-ch2')">
                <span class="model-title">CH2 ▾</span>
                <span class="model-time">--</span>
            </button>
        </div>
    </div>

    <!-- SCHWEBENDE MENÜS -->
    <div class="floating-popup runs-dropdown-popup" id="runDropdown-icon-ch1"></div>
    <div class="floating-popup runs-dropdown-popup" id="runDropdown-icon-ch2"></div>
    <div class="floating-popup layer2-dropdown-popup" id="layer2Dropdown"></div>

    <!-- EINSTELLUNGEN-POPUP -->
    <div class="floating-popup settings-popup" id="settingsPopup">
        <div class="settings-title">⚙ Karten- & Ebenen-Optionen</div>
        
        <!-- HINTERGRUNDKARTE: STIL & TRANSPARENZ -->
        <div class="settings-section">
            <div class="settings-section-title">Hintergrundkarte</div>
            <div class="settings-row">
                <span>Kartenstil:</span>
                <div class="mode-toggle-group">
                    <button class="mode-btn active" id="btnBaseRelief" onclick="setBaseMapStyle('relief')">Relief</button>
                    <button class="mode-btn" id="btnBaseSimple" onclick="setBaseMapStyle('simple')">Schlicht</button>
                </div>
            </div>
            <div class="settings-row">
                <span>Transparenz:</span>
                <input type="range" class="opacity-slider" id="opacitySliderBase" min="0" max="100" value="60" oninput="setBaseMapOpacity(this.value)">
                <span id="opacityLabelBase" style="width: 30px; text-align: right;">60%</span>
            </div>
        </div>

        <!-- 1. EBENE -->
        <div class="settings-section">
            <div class="settings-section-title" id="cfgTitleL1">1. Ebene: Basis</div>
            <div class="settings-row">
                <span>Darstellung:</span>
                <div class="mode-toggle-group">
                    <button class="mode-btn active" id="btnModeFillL1" onclick="setLayerMode(1, 'fill')">Farbe</button>
                    <button class="mode-btn" id="btnModeLineL1" onclick="setLayerMode(1, 'line')">Linien</button>
                </div>
            </div>
            <div class="settings-row">
                <span>Transparenz:</span>
                <input type="range" class="opacity-slider" id="opacitySliderL1" min="0" max="100" value="60" oninput="setLayerOpacity(1, this.value)">
                <span id="opacityLabelL1" style="width: 30px; text-align: right;">60%</span>
            </div>
        </div>

        <!-- 2. EBENE -->
        <div class="settings-section" id="cfgSectionL2" style="opacity: 0.5;">
            <div class="settings-section-title" id="cfgTitleL2">2. Ebene: Keine</div>
            <div class="settings-row">
                <span>Darstellung:</span>
                <div class="mode-toggle-group">
                    <button class="mode-btn active" id="btnModeFillL2" onclick="setLayerMode(2, 'fill')">Farbe</button>
                    <button class="mode-btn" id="btnModeLineL2" onclick="setLayerMode(2, 'line')">Linien</button>
                </div>
            </div>
            <div class="settings-row">
                <span>Transparenz:</span>
                <input type="range" class="opacity-slider" id="opacitySliderL2" min="0" max="100" value="60" oninput="setLayerOpacity(2, this.value)">
                <span id="opacityLabelL2" style="width: 30px; text-align: right;">60%</span>
            </div>
        </div>
    </div>

    <div id="loadingIndicator">Lade Wetterdaten...</div>

    <!-- RECHTES PANEL (LÄUFE) MIT DYNAMISCHER HÖHE -->
    <div class="member-panel" id="memberPanel">
        <div class="member-panel-title">LÄUFE</div>
        <div class="member-section-title">Hauptlauf</div>
        <div id="hauptlaufContainer"></div>
        <div id="ensembleGroup">
            <div class="member-section-title" style="margin-top: 10px;">Ensemble</div>
            <button class="member-section-toggle" id="btnToggleEnsemble" onclick="toggleEnsembleAccordion()">
                <span>Members</span>
                <span id="ensembleChevron" class="chevron">▾</span>
            </button>
            <div id="ensembleContainer" class="member-grid" style="display: none;"></div>

            <div class="member-section-title" style="margin-top: 10px;">Statistiken</div>
            <div id="statistikenContainer" class="member-grid"></div>
        </div>
        <div id="onlyHlNotice" class="only-hl-info">Nur Hauptlauf verfügbar</div>
    </div>

    <!-- UNTERES KONTROLLZENTRUM IM MODERNEN DARK-LOOK -->
    <div class="control-panel">
        <div class="day-buttons-row" id="dayButtonsContainer"></div>
        <div class="main-controls-row">
            <button class="nav-btn" onclick="navLeft()">◀</button>
            <input type="range" id="timeSlider" min="0" max="23" value="0">
            <button class="nav-btn" onclick="navRight()">▶</button>
            <div class="member-nav-stack">
                <button class="member-stack-btn" onclick="navUp()">▲</button>
                <button class="member-stack-btn" onclick="navDown()">▼</button>
            </div>
            <button class="nav-mode-btn" id="navModeBtn" onclick="toggleNavMode()" title="Modus für ▲/▼: Member oder Modelläufe">Mbr</button>
        </div>
        <div class="bottom-labels-row">
            <span id="currentStepLabel">Wird geladen...</span>
            <span id="modelRunLabel">🕒 Wird geladen...</span>
        </div>
    </div>

    <!-- DYNAMISCHE LEGENDE -->
    <div class="legend-box" id="legendBox"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/d3-contour@4"></script>
    <script src="app.js?v=22"></script>
</body>
</html>
